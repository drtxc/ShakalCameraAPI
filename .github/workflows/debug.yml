name: Debug Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f "app/debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with short SHA
        id: rename
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NEW_NAME="ShakalCamera-debug-${SHORT_SHA}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/debug/${NEW_NAME}"
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=app/build/outputs/apk/debug/${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakal-camera-debug
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30

      - name: Delete old latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag -y || true

      - name: Create latest-debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Свежие шакалы (debug)"
          prerelease: true
          make_latest: false
          files: ${{ steps.rename.outputs.apk_path }}
          body: |
            ## Свежая debug-сборка
            
            **Коммит:** `${{ github.sha }}`
            **Дата:** ${{ github.event.head_commit.timestamp || 'workflow_dispatch' }}
            **Сообщение:** ${{ github.event.head_commit.message || 'Manual trigger' }}
            
            ### Установка
            1. Скачайте APK ниже
            2. Разрешите установку из неизвестных источников
            3. Установите APK
            
            ### Подпись
            Debug-ключ (androiddebugkey) — фиксированный, можно обновлять поверх предыдущей версии.
            
            ---
            *Автоматическая сборка из ветки main*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
