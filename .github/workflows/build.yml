name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Check signing secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode release keystore
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release APK
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename release APK
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NEW_NAME="ShakalCamera-${TAG}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/release/${NEW_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${NEW_NAME}" >> $GITHUB_ENV

      - name: Build Debug APK (fallback)
        if: steps.check-secrets.outputs.has_secrets == 'false'
        run: |
          ./gradlew assembleDebug
          # Generate debug keystore for fallback
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Rename debug APK (fallback)
        if: steps.check-secrets.outputs.has_secrets == 'false'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NEW_NAME="ShakalCamera-${TAG}-debug-signed.apk"
          mv "$APK_PATH" "app/build/outputs/apk/debug/${NEW_NAME}"
          echo "APK_PATH=app/build/outputs/apk/debug/${NEW_NAME}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          prerelease: ${{ steps.check-secrets.outputs.has_secrets != 'true' }}
          make_latest: ${{ steps.check-secrets.outputs.has_secrets == 'true' }}
          body: |
            ## ШакалCamera ${{ github.ref_name }}
            
            ${{ steps.check-secrets.outputs.has_secrets == 'true' && '### Release сборка с подписью' || '### Debug-сборка (секреты подписи не заданы)' }}
            
            **Тег:** `${{ github.ref_name }}`
            **Коммит:** `${{ github.sha }}`
            
            ${{ steps.check-secrets.outputs.has_secrets != 'true' && '> ⚠️ **Внимание:** Это debug-сборка с тестовой подписью. Для release-сборки добавьте секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD в настройки репозитория.' || '' }}
            
            ### Установка
            1. Скачайте APK
            2. Разрешите установку из неизвестных источников
            3. Установите APK
            
            ### Разрешения
            - Камера (обязательно)
            - Микрофон (для видео)
            
            ### Лицензия
            GPL-3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup release keystore
        if: always() && steps.check-secrets.outputs.has_secrets == 'true'
        run: rm -f app/release.keystore
